<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eee9dd" />
    <meta name="description" content="Fight rogue robots, collect scrap, and survive the next wave." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Chatastrophe</title>
  </head>
  <body>
    <main class="workbench">
      <header class="masthead">
        <div class="identity"><span class="identity-mark" aria-hidden="true">C<span>•</span></span><h1>Chatastrophe</h1></div>
      </header>
      <div class="play-layout">
      <section class="arena" aria-label="Arena survival game">
        <div id="game-shell">
        <div class="stage">
          <div id="game-container" tabindex="0" role="application" aria-label="Chatastrophe arena. Move with WASD or arrow keys. Attacks fire automatically. Escape pauses.">
            <p id="load-status" class="load-status" role="status">Loading…</p>
          </div>
          <div id="hud" class="hud" hidden>
            <div class="wave-stat"><span class="stat-label">Wave</span><strong id="wave-value">1</strong></div>
            <div class="hud-stat health-stat" title="Health"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z" /></svg><span class="sr-only">Health</span><strong id="health-value">100 / 100</strong></div>
            <div class="hud-stat" title="Time left"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg><span class="sr-only">Time left</span><strong id="time-value">0:30</strong></div>
            <div class="hud-stat" title="Scrap"><span class="scrap-icon" aria-hidden="true"><img src="./assets/scrap.png" alt="" /></span><span class="sr-only">Scrap</span><strong id="scrap-value">0</strong></div>
            <div class="hud-stat" title="Robots defeated"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 3h3v12H5V6h3l1-3ZM9 18v3M15 18v3M9 10h.01M15 10h.01M9 14h6" /></svg><span class="sr-only">Robots defeated</span><strong id="kills-value">0</strong></div>
          </div>
          <div id="game-menu" class="game-menu" hidden>
            <section id="panel-ready" class="menu-panel start-panel" aria-label="Start a run">
              <div id="ready-changes" class="wave-changes" hidden></div>
              <button id="start-run" class="primary" type="button">Start run <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z" /></svg></button>
              <div class="control-note"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / arrows to move</span><span>Auto-fire</span></div>
            </section>
            <section id="panel-shop" class="menu-panel shop-panel" aria-labelledby="shop-title" hidden>
              <h3 id="shop-title">Upgrades</h3>
              <p>Health restored. Choose one upgrade or save your scrap.</p>
              <strong id="shop-wallet" class="wallet">0 scrap available</strong>
              <div class="upgrades">
                <button id="buy-damage" type="button"><span class="upgrade-symbol" aria-hidden="true">↗</span><b>Stronger shots</b><span>6 more damage per shot</span><strong class="price">60 scrap</strong></button>
                <button id="buy-attackSpeed" type="button"><span class="upgrade-symbol" aria-hidden="true">»</span><b>Shoot faster</b><span>Up to 33% faster firing</span><strong class="price">60 scrap</strong></button>
                <button id="buy-movementSpeed" type="button"><span class="upgrade-symbol" aria-hidden="true">↝</span><b>Move faster</b><span>Up to 15% faster movement</span><strong class="price">60 scrap</strong></button>
              </div>
              <p id="shop-status" class="shop-status" role="status"></p>
              <div id="shop-changes" class="wave-changes" hidden></div>
              <button id="next-wave" class="primary" type="button">Start wave 2</button>
            </section>
            <section id="panel-lost" class="menu-panel" aria-labelledby="lost-title" hidden>
              <h3 id="lost-title">Run ended</h3><p id="lost-summary" class="result-summary"></p><button id="try-again" class="primary" type="button">Try again</button>
            </section>
            <section id="panel-paused" class="menu-panel" aria-labelledby="paused-title" hidden>
              <h3 id="paused-title">Paused</h3><button id="resume" class="primary" type="button">Resume run</button>
            </section>
          </div>
        </div>
        <section id="active-changes" class="active-changes" aria-labelledby="active-name" hidden><h2 id="active-name"></h2><p id="active-description"></p></section>
        <div class="game-toolbar">
          <p id="scene-status" role="status">Loading…</p>
          <div class="game-controls">
            <button id="pause" class="icon-button" type="button" aria-label="Pause" title="Pause (Esc)" disabled aria-pressed="false">
              <svg class="icon-default" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" /></svg>
              <svg class="icon-active" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z" /></svg>
            </button>
            <button id="new-run" class="icon-button" type="button" aria-label="Restart run" title="Restart run" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6" /></svg></button>
            <button id="fullscreen" class="icon-button" type="button" aria-label="Fullscreen" title="Fullscreen" aria-pressed="false" disabled>
              <svg class="icon-default" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5" /></svg>
              <svg class="icon-active" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h5V3M16 3v5h5M21 16h-5v5M8 21v-5H3" /></svg>
            </button>
          </div>
        </div>
        <p id="fullscreen-status" class="fullscreen-status" role="status"></p>
        </div>
      </section>
      </div>
      <div id="developer-tools"></div>
    </main>
    <noscript>This game needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
